[project]
name = "pipeline"
version = "0.1.0"
description = "Idea in, product out. v0 vs v1 eval harness."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2,<2",
  "anthropic>=1.2,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: needs the real node toolchain (no LLM)",
  "real: spends tokens",
]
addopts = "-q -m 'not slow and not real'"
